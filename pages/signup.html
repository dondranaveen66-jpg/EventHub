```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - EventHub</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- ================================
         NAVIGATION
    ================================= -->

    <header>

        <nav>

            <h1>EventHub</h1>

            <ul>

                <li>
                    <a href="../index.html">Home</a>
                </li>

                <li>
                    <a href="events.html">Events</a>
                </li>

                <li>
                    <a href="login.html">Login</a>
                </li>

                <li>
                    <a href="signup.html">Sign Up</a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- ================================
         SIGNUP FORM
    ================================= -->

    <section class="form-section">

        <div class="form-container">

            <h2>Create Your Account 🚀</h2>

            <p>
                Join EventHub and discover exciting college events.
            </p>


            <form id="signupForm">


                <!-- Full Name -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- Create Account -->

                <button
                    type="submit"
                    class="form-btn">

                    Create Account

                </button>

            </form>


            <!-- Login Link -->

            <p class="form-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </section>


    <!-- ================================
         FOOTER
    ================================= -->

    <footer>

        <p>
            © 2026 EventHub |
            College Event Management System
        </p>

    </footer>


    <script src="../js/script.js"></script>

</body>

</html>
```
