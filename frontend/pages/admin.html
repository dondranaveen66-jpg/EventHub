<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - EventHub</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <nav>
            <h1>EventHub Admin</h1>

            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="#" id="logoutBtn">Logout</a></li>
            </ul>
        </nav>
    </header>


    <!-- Admin Dashboard -->
    <section class="admin-section">

        <h2>Admin Dashboard 👨‍💼</h2>
        <p>Manage all college events from one place.</p>


        <!-- Add Event Form -->
        <div class="admin-form-container">

            <h3>➕ Add New Event</h3>

            <form id="addEventForm">

                <div class="form-group">
                    <label>Event Name</label>

                    <input
                        type="text"
                        id="eventName"
                        placeholder="Enter event name"
                        required
                    >
                </div>


                <div class="form-group">
                    <label>Description</label>

                    <textarea
                        id="eventDescription"
                        placeholder="Enter event description"
                        required
                    ></textarea>
                </div>


                <div class="form-group">
                    <label>Event Date</label>

                    <input
                        type="date"
                        id="eventDate"
                        required
                    >
                </div>


                <div class="form-group">
                    <label>Event Location</label>

                    <input
                        type="text"
                        id="eventLocation"
                        placeholder="Enter event location"
                        required
                    >
                </div>


                <button type="submit" class="form-btn">
                    Add Event
                </button>

            </form>

        </div>


        <!-- Manage Events -->
        <div class="manage-events">

            <h3>📅 Manage Events</h3>

            <!-- Events will be loaded from MySQL -->
            <div id="eventsList">

                <p>Loading events...</p>

            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 EventHub | College Event Management System
        </p>

    </footer>


    <script src="../js/script.js"></script>


    <script>

        // ==========================================
        // GET TOKEN
        // ==========================================

        const token = localStorage.getItem("token");


        // ==========================================
        // CHECK LOGIN
        // ==========================================

        if (!token) {

            alert("Please login first!");

            window.location.href = "login.html";

        }


        // ==========================================
        // LOAD ALL EVENTS
        // ==========================================

        async function loadEvents() {

            try {

                const response = await fetch(
                    "http://localhost:5000/api/admin/events",
                    {
                        method: "GET",

                        headers: {
                            "Authorization": `Bearer ${token}`
                        }
                    }
                );


                const data = await response.json();


                if (!response.ok) {

                    alert(data.message || "Failed to load events");

                    return;
                }


                const eventsList =
                    document.getElementById("eventsList");

                eventsList.innerHTML = "";


                if (!data.events || data.events.length === 0) {

                    eventsList.innerHTML =
                        "<p>No events available.</p>";

                    return;
                }


                data.events.forEach(event => {

                    const eventCard =
                        document.createElement("div");

                    eventCard.className =
                        "admin-event-card";


                    eventCard.innerHTML = `

                        <div>

                            <h4>🎉 ${event.event_name}</h4>

                            <p>
                                ${event.description}
                            </p>

                            <p>
                                Date: ${formatDate(event.event_date)}
                            </p>

                            <p>
                                Location: ${event.event_location}
                            </p>

                        </div>


                        <div class="admin-actions">

                            <button
                                class="edit-btn"
                                onclick="editEvent(${event.event_id})"
                            >
                                Edit
                            </button>


                            <button
                                class="delete-btn"
                                onclick="deleteEvent(${event.event_id})"
                            >
                                Delete
                            </button>

                        </div>

                    `;


                    eventsList.appendChild(eventCard);

                });

            }

            catch (error) {

                console.error(
                    "Load events error:",
                    error
                );

                document.getElementById("eventsList").innerHTML =
                    "<p>Unable to load events.</p>";

            }

        }


        // ==========================================
        // FORMAT DATE
        // ==========================================

        function formatDate(date) {

            if (!date) {
                return "Date not available";
            }

            const d = new Date(date);

            return d.toLocaleDateString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "long",
                    year: "numeric"
                }
            );

        }


        // ==========================================
        // ADD EVENT
        // ==========================================

        document
            .getElementById("addEventForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();


                const eventName =
                    document.getElementById("eventName").value.trim();

                const eventDescription =
                    document.getElementById("eventDescription").value.trim();

                const eventDate =
                    document.getElementById("eventDate").value;

                const eventLocation =
                    document.getElementById("eventLocation").value.trim();


                try {

                    const response = await fetch(
                        "http://localhost:5000/api/admin/events",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json",
                                "Authorization": `Bearer ${token}`
                            },

                            body: JSON.stringify({

                                event_name: eventName,
                                description: eventDescription,
                                event_date: eventDate,
                                event_location: eventLocation

                            })
                        }
                    );


                    const data = await response.json();


                    if (response.ok) {

                        alert(data.message);

                        document
                            .getElementById("addEventForm")
                            .reset();

                        loadEvents();

                    } else {

                        alert(
                            data.message ||
                            "Failed to add event"
                        );

                    }

                }

                catch (error) {

                    console.error(
                        "Add event error:",
                        error
                    );

                    alert(
                        "Cannot connect to server."
                    );

                }

            });


        // ==========================================
        // EDIT EVENT
        // ==========================================

        async function editEvent(eventId) {

            const newName =
                prompt("Enter new event name:");

            if (!newName) {
                return;
            }


            const newDescription =
                prompt("Enter new description:");

            if (!newDescription) {
                return;
            }


            const newDate =
                prompt(
                    "Enter event date (YYYY-MM-DD):"
                );

            if (!newDate) {
                return;
            }


            const newLocation =
                prompt("Enter event location:");

            if (!newLocation) {
                return;
            }


            try {

                const response = await fetch(
                    `http://localhost:5000/api/admin/events/${eventId}`,
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": `Bearer ${token}`
                        },

                        body: JSON.stringify({

                            event_name: newName,
                            description: newDescription,
                            event_date: newDate,
                            event_location: newLocation

                        })
                    }
                );


                const data = await response.json();


                if (response.ok) {

                    alert(data.message);

                    loadEvents();

                } else {

                    alert(
                        data.message ||
                        "Failed to update event"
                    );

                }

            }

            catch (error) {

                console.error(
                    "Edit event error:",
                    error
                );

                alert(
                    "Cannot connect to server."
                );

            }

        }


        // ==========================================
        // DELETE EVENT
        // ==========================================

        async function deleteEvent(eventId) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this event?"
                );


            if (!confirmDelete) {
                return;
            }


            try {

                const response = await fetch(
                    `http://localhost:5000/api/admin/events/${eventId}`,
                    {
                        method: "DELETE",

                        headers: {
                            "Authorization": `Bearer ${token}`
                        }
                    }
                );


                const data = await response.json();


                if (response.ok) {

                    alert(data.message);

                    loadEvents();

                } else {

                    alert(
                        data.message ||
                        "Failed to delete event"
                    );

                }

            }

            catch (error) {

                console.error(
                    "Delete event error:",
                    error
                );

                alert(
                    "Cannot connect to server."
                );

            }

        }


        // ==========================================
        // LOGOUT
        // ==========================================

        document
            .getElementById("logoutBtn")
            .addEventListener("click", function(event) {

                event.preventDefault();

                localStorage.removeItem("token");
                localStorage.removeItem("user");

                alert("Logged out successfully!");

                window.location.href = "login.html";

            });


        // ==========================================
        // LOAD EVENTS WHEN PAGE OPENS
        // ==========================================

        if (token) {

            loadEvents();

        }

    </script>

</body>

</html>
