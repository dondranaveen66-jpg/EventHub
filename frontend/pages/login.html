```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - EventHub</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- ================================
         NAVIGATION
    ================================= -->

    <header>

        <nav>

            <h1>EventHub</h1>

            <ul>

                <li>
                    <a href="../index.html">Home</a>
                </li>

                <li>
                    <a href="events.html">Events</a>
                </li>

                <li>
                    <a href="login.html">Login</a>
                </li>

                <li>
                    <a href="signup.html">Sign Up</a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- ================================
         LOGIN
    ================================= -->

    <section class="form-section">

        <div class="form-container">

            <h2>Welcome Back! 👋</h2>

            <p>
                Login to continue to your EventHub account.
            </p>


            <form id="loginForm">


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="form-btn">

                    Login

                </button>

            </form>


            <!-- Signup Link -->

            <p class="form-link">

                Don't have an account?

                <a href="signup.html">
                    Create an account
                </a>

            </p>

        </div>

    </section>


    <!-- ================================
         FOOTER
    ================================= -->

    <footer>

        <p>
            © 2026 EventHub |
            College Event Management System
        </p>

    </footer>


    <script src="../js/script.js"></script>

</body>

</html>
```
