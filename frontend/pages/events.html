```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Events - EventHub</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <nav>
            <h1>EventHub</h1>

            <ul>
                <li>
                    <a href="../index.html">Home</a>
                </li>

                <li>
                    <a href="events.html">Events</a>
                </li>

                <li>
                    <a href="login.html">Login</a>
                </li>

                <li>
                    <a href="signup.html">Sign Up</a>
                </li>

                <li>
                    <a href="dashboard.html">Dashboard</a>
                </li>
            </ul>
        </nav>
    </header>


    <!-- Events Section -->
    <section class="events">

        <h2>All Upcoming Events</h2>

        <!-- Events will come from MySQL -->
        <div
            class="event-container"
            id="eventContainer">

            <p>Loading events...</p>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 EventHub | College Event Management System
        </p>

    </footer>


    <script src="../js/script.js"></script>


    <script>

        // ==========================================
        // LOAD EVENTS FROM DATABASE
        // ==========================================

        async function loadEvents() {

            const eventContainer =
                document.getElementById("eventContainer");

            try {

                const response = await fetch(
                    "http://localhost:5000/api/events"
                );

                const data = await response.json();

                if (!response.ok) {

                    eventContainer.innerHTML =
                        "<p>Unable to load events.</p>";

                    return;
                }


                eventContainer.innerHTML = "";


                // No events
                if (!data.events || data.events.length === 0) {

                    eventContainer.innerHTML =
                        "<p>No upcoming events available.</p>";

                    return;
                }


                // ==========================================
                // CREATE EVENT CARDS
                // ==========================================

                data.events.forEach(event => {

                    const eventCard =
                        document.createElement("div");

                    eventCard.className =
                        "event-card";


                    eventCard.innerHTML = `

                        <h3>🎉 ${event.event_name}</h3>

                        <p>
                            ${event.description}
                        </p>

                        <p>
                            Date:
                            ${formatDate(event.event_date)}
                        </p>

                        <p>
                            Location:
                            ${event.event_location}
                        </p>

                        <button
                            class="register-btn"
                            data-event-id="${event.event_id}">
                            Register Now
                        </button>

                    `;


                    eventContainer.appendChild(eventCard);

                });


                // ==========================================
                // REGISTER BUTTONS
                // ==========================================

                const registerButtons =
                    document.querySelectorAll(".register-btn");


                registerButtons.forEach(button => {

                    button.addEventListener(
                        "click",
                        registerForEvent
                    );

                });

            }

            catch (error) {

                console.error(
                    "Load events error:",
                    error
                );

                eventContainer.innerHTML =
                    "<p>Cannot connect to server. Make sure the backend is running.</p>";

            }

        }


        // ==========================================
        // FORMAT DATE
        // ==========================================

        function formatDate(date) {

            if (!date) {
                return "Date not available";
            }

            const d = new Date(date);

            return d.toLocaleDateString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "long",
                    year: "numeric"
                }
            );

        }


        // ==========================================
        // REGISTER FOR EVENT
        // ==========================================

        async function registerForEvent() {

            const button = this;

            const token =
                localStorage.getItem("token");


            // User not logged in
            if (!token) {

                alert(
                    "Please login first to register for an event!"
                );

                window.location.href =
                    "login.html";

                return;
            }


            const eventId =
                button.dataset.eventId;


            if (!eventId) {

                alert("Event ID is missing!");

                return;
            }


            try {

                const response = await fetch(
                    "http://localhost:5000/api/registrations/register",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",

                            "Authorization":
                                `Bearer ${token}`
                        },

                        body: JSON.stringify({
                            eventId: eventId
                        })
                    }
                );


                const data =
                    await response.json();


                if (response.ok) {

                    alert(data.message);

                    button.textContent =
                        "Registered";

                    button.disabled = true;

                }

                else {

                    alert(
                        data.message ||
                        "Registration failed"
                    );

                }

            }

            catch (error) {

                console.error(
                    "Registration error:",
                    error
                );

                alert(
                    "Cannot connect to server."
                );

            }

        }


        // ==========================================
        // START
        // ==========================================

        loadEvents();

    </script>

</body>

</html>
```
